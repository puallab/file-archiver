services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_archiver
      POSTGRES_USER: archiver
      POSTGRES_PASSWORD: archiver
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # MinIO 공식 이미지는 지원하지 않으므로 기존에 로컬에서 사용하던 이미지를 사용 -> 추후 해당 이미지 dokcer hun에 올려서 관리.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3 ls > /dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket inspection-files 2>/dev/null \
          || aws --endpoint-url http://minio:9000 s3 mb s3://inspection-files

volumes:
  postgres-data:
  minio-data:
