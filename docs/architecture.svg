<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="60" y="30" font-size="20" font-weight="700" fill="#111">file-archiver 아키텍처</text>

  <!-- Storage -->
  <rect x="60" y="50" width="1080" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="600" y="98" font-size="24" font-weight="700" text-anchor="middle" fill="#111">Storage (MinIO / S3)</text>

  <!-- file-agent + directory -->
  <rect x="60" y="380" width="220" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="425" font-size="20" font-weight="700" text-anchor="middle" fill="#111">file-agent</text>
  <text x="170" y="452" font-size="13" text-anchor="middle" fill="#475569">설비 PC</text>
  <rect x="100" y="580" width="140" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="616" font-size="16" text-anchor="middle" fill="#111">directory</text>

  <!-- file-archiver + worker -->
  <rect x="460" y="330" width="350" height="230" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="360" font-size="20" font-weight="700" fill="#111">file-archiver</text>
  <text x="480" y="382" font-size="13" fill="#475569">API</text>
  <rect x="580" y="430" width="210" height="100" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="685" y="470" font-size="17" font-weight="700" text-anchor="middle" fill="#111">Worker</text>
  <text x="685" y="495" font-size="13" text-anchor="middle" fill="#475569">포장/출하 파일 zip 처리</text>

  <!-- client -->
  <rect x="950" y="330" width="190" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1045" y="425" font-size="20" font-weight="700" text-anchor="middle" fill="#111">client</text>
  <text x="1045" y="450" font-size="14" text-anchor="middle" fill="#475569">(MES / web)</text>

  <!-- DB -->
  <rect x="300" y="720" width="600" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="772" font-size="24" font-weight="700" text-anchor="middle" fill="#111">Database (PostgreSQL)</text>

  <!-- ===== Blue: 검사 파일 업로드/등록 ===== -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="170" y1="580" x2="170" y2="482" marker-start="url(#ab)" marker-end="url(#ab)"/>
    <line x1="170" y1="378" x2="170" y2="133" marker-end="url(#ab)"/>
    <line x1="282" y1="405" x2="457" y2="405" marker-end="url(#ab)"/>
    <line x1="457" y1="455" x2="282" y2="455" marker-end="url(#ab)"/>
    <line x1="490" y1="562" x2="490" y2="717" marker-end="url(#ab)"/>
  </g>
  <g font-size="14" fill="#2563eb">
    <text x="180" y="540">① watch</text>
    <text x="180" y="260">② file upload</text>
    <text x="300" y="397">③ 검사 완료 (등록)</text>
    <text x="330" y="475">⑤ 응답</text>
    <text x="482" y="650" text-anchor="end">④ 검사결과 등록</text>
  </g>

  <!-- ===== Purple: 포장/출하 ===== -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <line x1="947" y1="355" x2="813" y2="355" marker-end="url(#ap)"/>
    <line x1="813" y1="385" x2="947" y2="385" marker-end="url(#ap)"/>
    <line x1="540" y1="562" x2="540" y2="717" marker-end="url(#ap)"/>
    <line x1="620" y1="532" x2="620" y2="717" marker-end="url(#ap)"/>
    <line x1="750" y1="532" x2="750" y2="717" marker-end="url(#ap)"/>
    <line x1="610" y1="428" x2="610" y2="133" marker-end="url(#ap)"/>
    <line x1="660" y1="133" x2="660" y2="428" marker-end="url(#ap)"/>
    <line x1="740" y1="428" x2="740" y2="133" marker-end="url(#ap)"/>
  </g>
  <g font-size="14" fill="#7c3aed">
    <text x="822" y="348">① 포장/출하 요청</text>
    <text x="850" y="405">③ 응답</text>
    <text x="544" y="660" font-size="12">② 포장/출하</text>
    <text x="544" y="676" font-size="12">결과 등록</text>
    <text x="628" y="600">④ 대상 확인</text>
    <text x="628" y="617">(조회)</text>
    <text x="758" y="600">⑧ 진행 갱신</text>
    <text x="758" y="617">(진행률/처리 상태)</text>
    <text x="530" y="200" text-anchor="end">⑤ 원본 file get</text>
    <text x="668" y="250">⑥ 원본 file</text>
    <text x="668" y="267">내려받기</text>
    <text x="748" y="200">⑦ zip upload</text>
  </g>
  <line x1="535" y1="195" x2="606" y2="195" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ===== Red: 다운로드 ===== -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <line x1="947" y1="470" x2="813" y2="470" marker-end="url(#ar)"/>
    <line x1="813" y1="505" x2="947" y2="505" marker-end="url(#ar)"/>
    <line x1="1000" y1="328" x2="1000" y2="133" marker-end="url(#ar)"/>
    <line x1="1090" y1="133" x2="1090" y2="328" marker-end="url(#ar)"/>
  </g>
  <g font-size="14" fill="#dc2626">
    <text x="822" y="462">① 다운로드 요청</text>
    <text x="822" y="525">② presigned URL</text>
    <text x="822" y="542">전달</text>
    <text x="990" y="280" text-anchor="end">③ 파일 다운로드</text>
    <text x="990" y="297" text-anchor="end">(presigned URL)</text>
    <text x="1098" y="220">④ 압축 파일</text>
    <text x="1098" y="237">전달</text>
  </g>

  <!-- Legend -->
  <g font-size="14">
    <rect x="60" y="840" width="1080" height="44" rx="8" fill="#fafafa" stroke="#e2e8f0"/>
    <line x1="80" y1="862" x2="120" y2="862" stroke="#2563eb" stroke-width="3"/>
    <text x="128" y="867" fill="#111">검사 파일 업로드·등록</text>
    <line x1="320" y1="862" x2="360" y2="862" stroke="#7c3aed" stroke-width="3"/>
    <text x="368" y="867" fill="#111">포장/출하 (요청 → Worker 압축)</text>
    <line x1="630" y1="862" x2="670" y2="862" stroke="#dc2626" stroke-width="3"/>
    <text x="678" y="867" fill="#111">출하 파일 다운로드</text>
  </g>
</svg>
